sentence=Touch subdevice library for HDL-Buspro-style RS485 bus (STM32duino/Arduino).
paragraph=Drives a BS8112 capacitive touch controller over I2C and speaks the HDL Buspro protocol for device discovery, addressing, and remarks. Includes a per-channel LED status indicator (LedHandler) with a Deactive/Active/Blink/Blinking state machine and 32-level software PWM brightness, driven by a TIM3 timer interrupt on STM32.
